name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Pages is still set to "Deploy from a branch", GitHub also publishes the raw
      # source (a blank page). Wait for that job so this proper build always lands last.
      # Once Settings -> Pages -> Source is "GitHub Actions", this finds nothing and moves on.
      - name: Wait for GitHub's branch deploy to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            pending=$(gh run list -R "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --json name,status \
              --jq '[.[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            echo "branch deploys still running: $pending"
            [ "$pending" = "0" ] && break
            sleep 10
          done
          sleep 5
      - id: deployment
        uses: actions/deploy-pages@v4
